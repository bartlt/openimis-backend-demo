# Screen: Medical items: search list (first page, sorted by code)
# Source: openimis-fe-medical_js@develop src/actions.js fetchMedicalItemsSummaries; filters from src/components/MedicalItemSearcher.jsx (defaultOrderBy code, page size 10)
query GetMedicalItems {
  medicalItems(first: 10, orderBy: ["code"]) {
    totalCount
    pageInfo { hasNextPage, hasPreviousPage, startCursor, endCursor }
    edges {
      node {
        uuid
        code
        name
        type
        quantity
        maximumAmount
        price
        validityFrom
        validityTo
        package
      }
    }
  }
}
