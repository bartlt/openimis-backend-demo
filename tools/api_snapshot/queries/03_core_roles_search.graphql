# Screen: Administration > Roles: search list (first page, sorted by name)
# Source: openimis-fe-core_js@develop src/actions.jsx fetchRoles; filters from src/pages/Roles.jsx (DEFAULT_ORDER_BY = "name", page size 10)
query GetRole {
  role(first: 10, orderBy: ["name"]) {
    totalCount
    pageInfo { hasNextPage, hasPreviousPage, startCursor, endCursor }
    edges {
      node {
        id
        uuid
        name
        altLanguage
        isSystem
        isBlocked
        validityFrom
        validityTo
      }
    }
  }
}
